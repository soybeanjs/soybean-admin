name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# 最小权限：只做 review/describe + 发评论，不需要 contents/checks 的写权限。
# 配合下面的 config.restricted_mode，PR-Agent 不再去默认分支读 .pr_agent.toml。
permissions:
  issues: write
  pull-requests: write

# 快速连续 push 会触发多个 synchronize 事件。同一 PR 上只保留最新一次运行，
# 既避免对几乎相同的 diff 重复烧付费额度，也避免多个 job 争抢同一评论。
# 按事件类型拆组：评论触发的运行不能被 push 取消（否则用户主动请求的 review
# 可能在中途消失且无任何提示），评论之间也不互相取消，只排队。
concurrency:
  group: pr-agent-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ── 一处切换端点 / 模型 ─────────────────────────────────────────
  # GLM Coding Plan（消耗套餐额度；PR-Agent 不在智谱官方支持工具列表内，见 README 风险说明）
  OPENAI_API_BASE: https://open.bigmodel.cn/api/coding/paas/v4
  # 标准按量计费端点（合规、稳定，按 token 付费）：
  # OPENAI_API_BASE: https://open.bigmodel.cn/api/paas/v4
  # 换别的 OpenAI 兼容服务时只改上面这一行 + 下面的 model + 仓库 Secret

jobs:
  pr_agent_job:
    # 触发守卫：
    #  - 忽略 bot，避免自己的评论触发自己形成死循环。
    #  - pull_request 事件：fork PR 直接跳过（拿不到 secrets，OPENAI_KEY 为空，
    #    GITHUB_TOKEN 也被降级为只读，跑了只会报鉴权失败的红叉）。
    #  - issue_comment 事件：只认 PR 上的评论（普通 issue 不触发），
    #    且只允许 OWNER/MEMBER/COLLABORATOR，否则公共仓库任何人都能刷你的付费额度。
    #    fork 判断不放在这里，因为 issue_comment 的 payload 里没有 PR 的 head repo 信息，
    #    只能靠下面第一步调 API 查（见 guard step）。
    if: >-
      ${{ github.event.sender.type != 'Bot' &&
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true ||
           github.event_name != 'pull_request' &&
             github.event.issue.pull_request != null &&
             contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) }}
    runs-on: ubuntu-latest
    name: Run PR Agent on every pull request, respond to user comments
    steps:
      # issue_comment 的 payload 里没有 PR 的 head repo 信息，只能调一次 API 判断是否来自 fork。
      # 非评论事件跳过本步，此时 outputs.is_fork 为空，不影响下面 step 的执行。
      - name: Check whether the PR comes from a fork
        id: guard
        if: ${{ github.event_name == 'issue_comment' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_API_URL: ${{ github.event.issue.pull_request.url }}
        run: echo "is_fork=$(gh api "$PR_API_URL" --jq '.head.repo.fork')" >> "$GITHUB_OUTPUT"

      - name: PR Agent action step
        id: pragent
        if: ${{ steps.guard.outputs.is_fork != 'true' }}
        # 固定到完整 commit SHA（= v0.47.0），而不是可变 tag。
        # tag 可被上游重新指向，而这个 step 会拿到付费的 OPENAI_KEY 和有写权限的
        # GITHUB_TOKEN，所以必须用 SHA 固定。升级时手动改这一行。
        uses: the-pr-agent/pr-agent@8e5a9295973b24af4b70cafd0b660a230811ef9e # v0.47.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ── 模型接入（OpenAI 兼容协议，换模型只改这三行）──────────
          # Secret 名固定为 OPENAI_KEY，指向任意 OpenAI 兼容服务。
          # 三个变量名都写，成本为零：PR-Agent 自定义模型路径读 OPENAI.KEY，
          # 内置 OpenAI provider 路径读 OPENAI_KEY，LiteLLM 原生读 OPENAI_API_KEY。
          OPENAI.KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_KEY }}
          config.model: 'openai/glm-5.3'
          config.fallback_models: '["openai/glm-4.7"]'
          # 必填：LiteLLM 不认识 glm-*，PR-Agent 拿不到上下文长度会直接报错
          # "Model ... is not defined in MAX_TOKENS ... and no custom_model_max_tokens is set"
          config.custom_model_max_tokens: '128000'

          # ── 端点 ────────────────────────────────────────────────
          # 两套变量名都写：PR-Agent 读 OPENAI.API_BASE，LiteLLM 原生读 OPENAI_API_BASE
          OPENAI.API_BASE: ${{ env.OPENAI_API_BASE }}
          OPENAI_API_BASE: ${{ env.OPENAI_API_BASE }}

          # ── 行为 ────────────────────────────────────────────────
          config.response_language: 'zh-CN'
          config.ai_timeout: '300'
          # 无 contents:write 时必须开；跳过从默认分支读取 .pr_agent.toml 等需要读仓库的步骤
          config.restricted_mode: 'true'
          github_action_config.auto_review: 'true'
          github_action_config.auto_describe: 'true'
          github_action_config.auto_improve: 'false'
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          github_action_config.handle_push_trigger: 'false'

          # ── 评审聚焦 ─────────────────────────────────────────────
          # 把本仓库已核实的 PR-Agent 自身配置语义直接喂给评审模型，
          # 消除「用通用启发式误判 PR-Agent 配置键」这一类误报。
          pr_reviewer.extra_instructions: |-
            以下为本仓库已核实的 PR-Agent 自身配置语义，评审时不得据此报缺陷：
            1. handle_push_trigger: 'false' 只影响「PR 分支收到新提交(synchronize)时是否改跑 push_commands」。为 false 时 synchronize 正常落入 pr_actions 通用评审路径（上游源码先判 synchronize、仅在 push_trigger 为真时才提前 return）。它与 pr_actions 含 "synchronize" 是有意组合：不是死配置，也不会让 push 空跑。
            2. config.restricted_mode: 'true' 是最小权限（无 contents 权限）的有意选择。
            3. 本 workflow 只允许 pull_request 与 issue_comment 两个触发器；不要以「缺少 push 触发器」为由报缺陷。
            4. 对配置键的语义以本说明为准；只有注释与实际代码行为不一致时才可报。
          # 评审发现以行内评论落在 Files tab，而不是只堆在总结评论里
          pr_reviewer.inline_key_issues: 'true'
