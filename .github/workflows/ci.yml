---
name: CI

on:
  pull_request:
    branches: [main, v3]
  push:
    branches: [main, v3]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / test / build / bundle budget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ubean 的类型定义（.ubean/**）是构建产物、不入库（.gitignore 里忽略了 .ubean），
      # 而 `~ubean/openapi` 只有 build 的 openapi 步骤会写（dev 路径用 UBEAN_CODEGEN_BY_CLI=1
      # 跳过、`vp config` / npm `prepare` 也不生成）→ 必须在 typecheck 之前先 build，
      # 否则全新 checkout 会报 `Cannot find name 'definePage'` / `Cannot find module '~ubean/openapi'`。
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # 含「客户端导入纪律」守卫（src/shared/import-guard.test.ts）：
      # 从裸主入口 `ubean` 导入会让入口 chunk gzip +148%
      - name: Test
        run: pnpm test

      # 与 benchmarks/bundle-baseline.json 比对，gzip 增长 > 5% 失败
      - name: Bundle budget
        run: pnpm analyze:check

      # 样式产物守卫（G-06）。两次真实事故都是「dev 正常、build 丢样式」：
      #   1. 漏 `import 'uno.css'`        → 产物 CSS 49 B
      #   2. 漏 `import '@vean/ui/styles.css'` → 产物 CSS 4.2 kB（`ui: true` 的
      #      registry 注入只在 `ubean dev` 生效，构建路径会丢）
      # 正常值 ~188 kB（app-*.css）+ 懒加载页的独立 CSS；低于 150 kB 说明有一路没进产物。
      - name: CSS artifact guard
        run: |
          css=$(find dist/public/assets -name 'app-*.css' -maxdepth 1 | head -1)
          size=$(wc -c < "$css" | tr -d ' ')
          echo "CSS artifact: $css ($size bytes)"
          if [ "$size" -lt 153600 ]; then
            echo "::error::CSS artifact is only $size bytes (expected >150000)."
            echo "Likely a missing style import in src/app.ts — it needs BOTH:"
            echo "  import 'uno.css';            // app utilities"
            echo "  import '@vean/ui/styles.css'; // component styles"
            exit 1
          fi
